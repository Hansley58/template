<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 Romantic Site Tracker - Spark Admin</title>
    <link rel="stylesheet" href="assets/libs/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/libs/bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        body {
            background: #f4f6f8;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .tracker-wrap { max-width: 1200px; margin: 0 auto; }
        .tracker-header {
            background: linear-gradient(135deg, #ff8eb5, #ff5e8a);
            color: white;
            padding: 30px 36px;
            border-radius: 24px;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px -12px rgba(255, 94, 138, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .tracker-header h1 {
            font-size: 2rem;
            margin: 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .tracker-header p { margin: 4px 0 0; opacity: 0.9; font-size: 0.95rem; }
        .tracker-header .badge-live {
            background: rgba(255, 255, 255, 0.25);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .pulse-dot {
            width: 9px; height: 9px; background: #B4F105; border-radius: 50%;
            animation: pulseDot 1.6s infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.4); }
        }
        .btn-header-action {
            background: white;
            color: #b34167;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-header-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            color: #b34167;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
            border-left: 5px solid #ff5e8a;
            transition: all 0.25s;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,0.08); }
        .stat-card .stat-label { color: #7a7a7a; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .stat-card .stat-value { font-size: 2.4rem; font-weight: 700; color: #2d2d2d; margin-top: 8px; }
        .stat-card.yes { border-left-color: #22c55e; }
        .stat-card.yes .stat-value { color: #16a34a; }
        .stat-card.no { border-left-color: #ef4444; }
        .stat-card.no .stat-value { color: #dc2626; }
        .stat-card.plan { border-left-color: #a855f7; }
        .stat-card.plan .stat-value { color: #9333ea; }
        .stat-card.visit { border-left-color: #0ea5e9; }
        .stat-card.visit .stat-value { color: #0284c7; }
        .panel {
            background: white;
            border-radius: 20px;
            padding: 24px 28px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }
        .panel h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d2d2d;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .panel h2 i { color: #ff5e8a; }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-style: italic;
        }
        .empty-state i { font-size: 2.5rem; color: #ddd; display: block; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        table th {
            text-align: left;
            padding: 12px 14px;
            background: #f8f9fb;
            color: #666;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 700;
            border-bottom: 2px solid #eee;
        }
        table td {
            padding: 12px 14px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.92rem;
            color: #333;
            vertical-align: top;
        }
        table tr:hover td { background: #fdf5f8; }
        .pill {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .pill-yes { background: #dcfce7; color: #166534; }
        .pill-no { background: #fee2e2; color: #991b1b; }
        .plan-detail {
            background: #fdf5f8;
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 6px;
            font-size: 0.85rem;
            line-height: 1.6;
            border: 1px dashed #ffb6c1;
        }
        .plan-detail strong { color: #b34167; }
        .btn-clear {
            background: transparent;
            color: #dc2626;
            border: 2px solid #fca5a5;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-clear:hover { background: #fee2e2; }
        .btn-refresh {
            background: #f0f0f0;
            color: #333;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-refresh:hover { background: #e0e0e0; }
        .panel-actions { display: flex; gap: 10px; margin-left: auto; }
        @media (max-width: 640px) {
            .tracker-header { padding: 22px; }
            .tracker-header h1 { font-size: 1.4rem; }
            table th, table td { padding: 8px 10px; font-size: 0.82rem; }
        }
    </style>
</head>
<body>
<div class="tracker-wrap">

    <div class="tracker-header">
        <div>
            <h1><i class="bi bi-heart-fill"></i> Romantic Site Tracker</h1>
            <p>Live data from your romantic proposal site</p>
            <span class="badge-live" style="margin-top:10px;"><span class="pulse-dot"></span> Live • Auto-refresh every 5s</span>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <a href="index.html" class="btn-header-action">
                <i class="bi bi-grid-fill"></i> Back to Dashboard
            </a>
            <a href="https://hansley58.github.io/mysite/" target="_blank" class="btn-header-action">
                <i class="bi bi-box-arrow-up-right"></i> Open Romantic Site
            </a>
        </div>
    </div>

    <!-- Stat cards -->
    <div class="stat-grid">
        <div class="stat-card visit">
            <div class="stat-label"><i class="bi bi-eye"></i> Total Visits</div>
            <div class="stat-value" id="stat-visits">0</div>
        </div>
        <div class="stat-card yes">
            <div class="stat-label"><i class="bi bi-emoji-heart-eyes"></i> Said YES</div>
            <div class="stat-value" id="stat-yes">0</div>
        </div>
        <div class="stat-card no">
            <div class="stat-label"><i class="bi bi-emoji-frown"></i> Said NO</div>
            <div class="stat-value" id="stat-no">0</div>
        </div>
        <div class="stat-card plan">
            <div class="stat-label"><i class="bi bi-calendar-heart"></i> Date Plans</div>
            <div class="stat-value" id="stat-plans">0</div>
        </div>
    </div>

    <!-- Answers panel -->
    <div class="panel">
        <h2><i class="bi bi-chat-heart"></i> Answers <span class="panel-actions" style="margin-left:auto;">
            <button class="btn-refresh" id="btn-refresh"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
            <button class="btn-clear" id="btn-clear"><i class="bi bi-trash"></i> Clear all</button>
        </span></h2>
        <div id="answers-container"></div>
    </div>

    <!-- Visits panel -->
    <div class="panel">
        <h2><i class="bi bi-graph-up"></i> Recent Visits</h2>
        <div id="visits-container"></div>
    </div>

</div>

<script>
    const TRACKING_KEY = 'sparkRomanticTracking';

    function loadTracking() {
        try {
            const raw = localStorage.getItem(TRACKING_KEY);
            if (!raw) return { visits: [], answers: [] };
            const data = JSON.parse(raw);
            return {
                visits: Array.isArray(data.visits) ? data.visits : [],
                answers: Array.isArray(data.answers) ? data.answers : []
            };
        } catch (e) {
            return { visits: [], answers: [] };
        }
    }

    function saveTracking(data) {
        try { localStorage.setItem(TRACKING_KEY, JSON.stringify(data)); } catch (e) {}
    }

    function formatDate(iso) {
        if (!iso) return '-';
        try {
            const d = new Date(iso);
            return d.toLocaleString('en-US', {
                month: 'short', day: 'numeric', year: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
        } catch (e) { return iso; }
    }

    function render() {
        const data = loadTracking();

        // Stats
        const yesCount = data.answers.filter(a => a.answer === 'yes').length;
        const noCount = data.answers.filter(a => a.answer === 'no').length;
        const planCount = data.answers.filter(a => a.plan).length;

        document.getElementById('stat-visits').textContent = data.visits.length;
        document.getElementById('stat-yes').textContent = yesCount;
        document.getElementById('stat-no').textContent = noCount;
        document.getElementById('stat-plans').textContent = planCount;

        // Answers table
        const ansContainer = document.getElementById('answers-container');
        if (data.answers.length === 0) {
            ansContainer.innerHTML = `<div class="empty-state"><i class="bi bi-inbox"></i>No answers yet — the site hasn't been visited or answered yet.</div>`;
        } else {
            let html = `<table><thead><tr>
                <th style="width:60px;">#</th>
                <th style="width:180px;">When</th>
                <th style="width:100px;">Answer</th>
                <th>Date Plan Details</th>
            </tr></thead><tbody>`;
            // newest first
            const reversed = [...data.answers].reverse();
            reversed.forEach((a, i) => {
                const idx = data.answers.length - i;
                const pillCls = a.answer === 'yes' ? 'pill-yes' : 'pill-no';
                const pillLabel = a.answer === 'yes' ? 'YES 💖' : 'NO 🙈';
                let planHtml = '<span style="color:#bbb; font-style:italic;">—</span>';
                if (a.plan) {
                    planHtml = `<div class="plan-detail">
                        <div><strong>📅 Date:</strong> ${a.plan.dateFormatted || '-'}</div>
                        <div><strong>🌹 Flower:</strong> ${a.plan.flowers || '-'} ${a.plan.flowersPrice ? '· ' + a.plan.flowersPrice : ''}</div>
                        <div><strong>🍰 Treat:</strong> ${a.plan.treats || '-'} ${a.plan.treatsPrice ? '· ' + a.plan.treatsPrice : ''}</div>
                        <div><strong>☕ Drink:</strong> ${a.plan.drinks || '-'} ${a.plan.drinksPrice ? '· ' + a.plan.drinksPrice : ''}</div>
                        <div><strong>💕 Activity:</strong> ${a.plan.activities || '-'} ${a.plan.activitiesPrice ? '· ' + a.plan.activitiesPrice : ''}</div>
                        <div style="margin-top:6px; padding-top:6px; border-top:1px dashed #ffb6c1;"><strong>💰 Total:</strong> ${a.plan.total || '-'}</div>
                    </div>`;
                } else if (a.answer === 'yes') {
                    planHtml = '<span style="color:#f59e0b; font-style:italic;">Yes — but no plan submitted yet</span>';
                }
                html += `<tr>
                    <td><strong>${idx}</strong></td>
                    <td>${formatDate(a.timestamp)}</td>
                    <td><span class="pill ${pillCls}">${pillLabel}</span></td>
                    <td>${planHtml}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            ansContainer.innerHTML = html;
        }

        // Visits table
        const visContainer = document.getElementById('visits-container');
        if (data.visits.length === 0) {
            visContainer.innerHTML = `<div class="empty-state"><i class="bi bi-inbox"></i>No visits yet.</div>`;
        } else {
            let html = `<table><thead><tr>
                <th style="width:60px;">#</th>
                <th style="width:180px;">When</th>
                <th>Referrer</th>
                <th>User Agent</th>
            </tr></thead><tbody>`;
            const reversed = [...data.visits].reverse();
            reversed.slice(0, 50).forEach((v, i) => {
                const idx = data.visits.length - i;
                html += `<tr>
                    <td><strong>${idx}</strong></td>
                    <td>${formatDate(v.timestamp)}</td>
                    <td>${v.referrer || 'direct'}</td>
                    <td style="font-size:0.78rem; color:#888; max-width:400px; word-break:break-word;">${v.userAgent || '-'}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            if (data.visits.length > 50) {
                html += `<p style="text-align:center; color:#999; margin-top:14px; font-style:italic;">Showing latest 50 of ${data.visits.length} visits.</p>`;
            }
            visContainer.innerHTML = html;
        }
    }

    document.getElementById('btn-refresh').addEventListener('click', render);

    document.getElementById('btn-clear').addEventListener('click', () => {
        if (confirm('Clear all tracking data? This cannot be undone.')) {
            saveTracking({ visits: [], answers: [] });
            render();
        }
    });

    // initial render + auto-refresh every 5 seconds
    render();
    setInterval(render, 5000);
</script>
</body>
</html>
